# Select which system information to display.
show_ipv4=true
show_temperature=true
show_disks=true

# Leave empty to display IPv4 addresses from every active interface.
network_interface=

# Add one absolute mount path per disk. Repeated entries are supported.
disk=/
# disk=/mnt/data

# HC4 OLED defaults: I2C bus 1, address 0x3c.
i2c_device=/dev/i2c-1
i2c_address=0x3c

# Scroll speed is in pixels per second; refresh is in milliseconds.
scroll_speed=5
refresh_ms=100
